<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Analytics Pro</title>
    <!-- Asegúrate que el nombre sea idéntico al archivo en GitHub -->
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-[#070912] text-slate-200 p-4 md:p-8">
    <div class="max-w-[1400px] mx-auto">
        <!-- Header con Control de Sincronización -->
        <header class="flex justify-between items-center mb-10">
            <div>
                <h1 class="text-xl font-bold tracking-tighter uppercase">Métricas <span class="text-sky-500">Funded</span></h1>
                <p class="text-[10px] text-slate-500 uppercase tracking-widest">Gestión de Disciplina y Macros</p>
            </div>
            <button onclick="syncData()" class="bg-sky-600 hover:bg-sky-500 text-white text-xs font-bold py-2 px-6 rounded-lg transition-all shadow-lg shadow-sky-500/10">
                SINCRONIZAR DATOS
            </button>
        </header>

        <!-- Seccion de KPIs Principales -->
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
            <div class="tz-card p-5 border-l-2 border-sky-500">
                <p class="stat-label">Net P&L</p>
                <p id="stat-pl" class="stat-value text-white">$0.00</p>
            </div>
            <div class="tz-card p-5 border-l-2 border-emerald-500">
                <p class="stat-label">Avg Psicología</p>
                <p id="stat-psych" class="stat-value text-emerald-400">0.0</p>
            </div>
            <div class="tz-card p-5">
                <p class="stat-label">Win Rate</p>
                <p id="stat-wr" class="stat-value text-slate-300">0%</p>
            </div>
            <div class="tz-card p-5">
                <p class="stat-label">Profit Factor</p>
                <p id="stat-pf" class="stat-value text-slate-300">0.0</p>
            </div>
        </div>

        <!-- Dashboard Central -->
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
            <div class="lg:col-span-3 tz-card p-6">
                <h3 class="text-[10px] font-bold text-slate-500 uppercase mb-6 tracking-widest">Curva de Equidad Acumulada</h3>
                <canvas id="equityChart" height="120"></canvas>
            </div>

            <!-- Panel AI Mentor -->
            <div id="coach-card" class="tz-card p-6 border-t-2 border-sky-500">
                <div class="flex items-center gap-2 mb-4">
                    <div class="w-2 h-2 rounded-full bg-sky-500 animate-pulse"></div>
                    <h3 class="text-xs font-bold uppercase text-sky-400">AI Behavior Coach</h3>
                </div>
                <div id="ai-verdict" class="text-sm text-slate-400 leading-relaxed italic">
                    Analizando patrones de ejecución y fatiga...
                </div>
                <div id="coach-alert" class="hidden mt-4 p-3 bg-rose-500/10 border border-rose-500/20 rounded-lg">
                    <p class="text-[10px] font-bold text-rose-500 uppercase">⚠️ MODO PROTECCIÓN ACTIVADO</p>
                </div>
            </div>
        </div>

        <!-- Tabla de Auditoría -->
        <div class="mt-8 tz-card overflow-hidden">
            <table class="w-full text-left text-xs">
                <thead class="bg-white/2 text-slate-500 uppercase font-semibold">
                    <tr>
                        <th class="p-4">Fecha / Macro</th>
                        <th class="p-4 text-center">Psicología</th>
                        <th class="p-4">Gatillo Técnico</th>
                        <th class="p-4 text-right">P&L</th>
                    </tr>
                </thead>
                <tbody id="trade-table-body" class="divide-y divide-white/5"></tbody>
            </table>
        </div>
    </div>

    <!-- El orden de estos scripts es fundamental -->
    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
